name: Vendor Custom Nova Source

on:
  push:
    branches: [ "nova" ]
    paths:
      - ".github/workflows/vendor-custom-source.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configure build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip git pkg-config rsync

      - name: Materialize exact component bases
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nova-vendor
          mkdir -p /tmp/nova-vendor

          git clone --no-checkout https://github.com/nova-video-player/aos-Video.git /tmp/nova-vendor/Video
          git -C /tmp/nova-vendor/Video checkout --detach cab25da088a28601795c795c9ad6375f2054f60a

          git clone --no-checkout https://github.com/nova-video-player/aos-MediaLib.git /tmp/nova-vendor/MediaLib
          git -C /tmp/nova-vendor/MediaLib checkout --detach 3e904a4e657c2abc9a6b12192a095d52714041b7

          git clone --no-checkout https://github.com/nova-video-player/aos-avos.git /tmp/nova-vendor/avos
          git -C /tmp/nova-vendor/avos checkout --detach c594ce3b4c8c2d1dc7e1dd050812801e2040560f

      - name: Apply exact custom source
        shell: bash
        run: |
          set -euo pipefail
          cp -a custom-overrides/Video/. /tmp/nova-vendor/Video/
          cp -a custom-overrides/MediaLib/. /tmp/nova-vendor/MediaLib/
          cp -a custom-overrides/native/avos/. /tmp/nova-vendor/avos/

      - name: Verify custom component trees
        shell: bash
        run: |
          set -euo pipefail
          verify_tree() {
            local repo="$1"
            local expected="$2"
            git -C "$repo" add -f -A
            local actual
            actual="$(git -C "$repo" write-tree)"
            echo "$repo tree: $actual"
            test "$actual" = "$expected"
          }

          verify_tree /tmp/nova-vendor/Video 1bc28f7532b520658b1c6cf7482924a9ef121f8e
          verify_tree /tmp/nova-vendor/MediaLib 14bbdf89b76725df73b31116c0bf5eedeb83f650
          verify_tree /tmp/nova-vendor/avos 675e0e04707905a605797fc314181ccc363ca0c3

      - name: Replace component submodules with vendored custom source
        shell: bash
        run: |
          set -euo pipefail

          git rm --cached -f Video MediaLib native/avos
          rm -rf Video MediaLib native/avos

          mkdir -p Video MediaLib native/avos
          rsync -a --exclude='.git' /tmp/nova-vendor/Video/ Video/
          rsync -a --exclude='.git' /tmp/nova-vendor/MediaLib/ MediaLib/
          rsync -a --exclude='.git' /tmp/nova-vendor/avos/ native/avos/

          rm -rf custom-overrides
          rm -f .github/workflows/nova.yml
          rm -f .github/workflows/vendor-custom-source.yml

      - name: Point remaining submodules at official upstream repositories
        shell: bash
        run: |
          set -euo pipefail
          cat > .gitmodules <<'EOF'
          [submodule "FileCoreLibrary"]
            path = FileCoreLibrary
            url = https://github.com/nova-video-player/aos-FileCoreLibrary.git
            branch = v6.4
          [submodule "native/audiocompress"]
            path = native/audiocompress
            url = https://github.com/nova-video-player/aos-audiocompress.git
            branch = master
          [submodule "native/ffmpeg-android-builder"]
            path = native/ffmpeg-android-builder
            url = https://github.com/nova-video-player/ffmpeg-android-builder-nobin.git
            branch = v8_0
          [submodule "native/dav1d-android-builder"]
            path = native/dav1d-android-builder
            url = https://github.com/nova-video-player/dav1d-android-builder-nobin.git
            branch = v1_4
          [submodule "native/opus-android-builder"]
            path = native/opus-android-builder
            url = https://github.com/nova-video-player/opus-android-builder-nobin.git
            branch = 20241012
          [submodule "native/libmysofa-android-builder"]
            path = native/libmysofa-android-builder
            url = https://github.com/nova-video-player/libmysofa-android-builder.git
            branch = main
          [submodule "native/openssl-android-builder"]
            path = native/openssl-android-builder
            url = https://github.com/nova-video-player/openssl-android-builder-nobin.git
            branch = v3_5_2
          [submodule "native/libyuv"]
            path = native/libyuv
            url = https://github.com/nova-video-player/aos-libyuv.git
            branch = master
          [submodule "native/libnativehelper"]
            path = native/libnativehelper
            url = https://github.com/nova-video-player/aos-libnativehelper.git
            branch = master
          [submodule "native/boost"]
            path = native/boost
            url = https://github.com/nova-video-player/aos-boost-android-builder.git
            branch = master
          [submodule "native/libtorrent-android-builder"]
            path = native/libtorrent-android-builder
            url = https://github.com/nova-video-player/aos-libtorrent-android-builder.git
            branch = main
          [submodule "native/torrentd"]
            path = native/torrentd
            url = https://github.com/nova-video-player/torrentd-nobin.git
            branch = master
          [submodule "native/prebuilt/ffmpeg"]
            path = native/prebuilt/ffmpeg
            url = https://github.com/nova-video-player/prebuilt-ffmpeg.git
            branch = v8_0
          [submodule "native/prebuilt/opus"]
            path = native/prebuilt/opus
            url = https://github.com/nova-video-player/prebuilt-opus.git
            branch = main
          [submodule "native/prebuilt/dav1d"]
            path = native/prebuilt/dav1d
            url = https://github.com/nova-video-player/prebuilt-dav1d.git
            branch = v1_5
          [submodule "native/prebuilt/openssl"]
            path = native/prebuilt/openssl
            url = https://github.com/nova-video-player/prebuilt-openssl.git
            branch = v3_5
          [submodule "native/prebuilt/libmysofa"]
            path = native/prebuilt/libmysofa
            url = https://github.com/nova-video-player/prebuilt-libmysofa.git
            branch = v1_3
          [submodule "native/prebuilt/torrentd"]
            path = native/prebuilt/torrentd
            url = https://github.com/nova-video-player/prebuilt-torrentd.git
            branch = main
          EOF

      - name: Install direct-source custom CI
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/nova-custom.yml <<'EOF'
          name: Nova Custom APK

          on:
            push:
              branches: [ "nova" ]
              paths:
                - "Video/**"
                - "MediaLib/**"
                - "native/avos/**"
                - "FileCoreLibrary"
                - "native/**"
                - ".gitmodules"
                - ".github/workflows/nova-custom.yml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 45

              steps:
                - name: Checkout custom Nova source
                  uses: actions/checkout@v4
                  with:
                    submodules: recursive

                - name: Set up Java 17
                  uses: actions/setup-java@v4
                  with:
                    java-version: "17"
                    distribution: "temurin"

                - name: Configure Android build environment
                  shell: bash
                  run: |
                    echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
                    echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

                - name: Install build packages
                  run: |
                    sudo apt-get update || sudo apt-get update
                    sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip git pkg-config

                - name: Build universal debug APK
                  run: |
                    cd Video
                    ./gradlew --no-daemon -Puniversal assembleNoamazonDebug

                - name: Collect APK
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p artifacts
                    APK="$(find Video/build/outputs/apk -type f -name '*.apk' | head -n 1)"
                    test -n "$APK"
                    cp "$APK" artifacts/Nova-Custom-debug.apk
                    sha256sum artifacts/Nova-Custom-debug.apk | tee artifacts/SHA256.txt

                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: nova-custom-debug
                    path: |
                      artifacts/Nova-Custom-debug.apk
                      artifacts/SHA256.txt
                    if-no-files-found: error
                    retention-days: 14
          EOF

      - name: Update source baseline
        shell: bash
        run: |
          set -euo pipefail
          cat > SOURCE_BASELINE.md <<'EOF'
          # Custom Nova source baseline

          This fork is the canonical repository for the custom Nova build.

          The custom source is vendored directly in the repository:
          - `Video/`
          - `MediaLib/`
          - `native/avos/`

          Initial vendored migration baseline:
          - Video tree: `1bc28f7532b520658b1c6cf7482924a9ef121f8e`
          - MediaLib tree: `14bbdf89b76725df73b31116c0bf5eedeb83f650`
          - native/avos tree: `675e0e04707905a605797fc314181ccc363ca0c3`

          Those trees were reconstructed from the recorded upstream bases plus the previous custom Nova changes and verified byte-for-byte before vendoring.

          Recorded upstream bases for that migration:
          - Video: `cab25da088a28601795c795c9ad6375f2054f60a`
          - MediaLib: `3e904a4e657c2abc9a6b12192a095d52714041b7`
          - native/avos: `c594ce3b4c8c2d1dc7e1dd050812801e2040560f`

          Future upstream changes must be reviewed and merged deliberately into these vendored custom trees. They are not automatically overlaid or pulled into the custom build.
          EOF

      - name: Initialize unchanged upstream dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      - name: Verify vendored paths and build
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          test "$(git ls-files -s Video | awk 'NR==1{print $1}')" != "160000"
          test "$(git ls-files -s MediaLib | awk 'NR==1{print $1}')" != "160000"
          test "$(git ls-files -s native/avos | awk 'NR==1{print $1}')" != "160000"

          cd Video
          ./gradlew --no-daemon -Puniversal assembleNoamazonDebug

      - name: Upload migration validation APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-vendored-migration-debug
          path: Video/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit vendored custom source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Vendor custom Nova source directly"
          git push origin HEAD:nova
