name: TV Dolby Vision APK

on:
  push:
    branches: [tv-dolby-vision]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-dolby-vision-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/tv-dolby-vision'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned official NOVA components
        shell: bash
        run: |
          set -euo pipefail
          # Relative fork URLs would resolve to shadow-pheonix. Always use official sources.
          python3 - <<'PY'
          import configparser, subprocess
          c = configparser.ConfigParser()
          c.read('.gitmodules')
          for section in c.sections():
              name = section.split('"')[1]
              url = c[section]['url']
              if not url.startswith('../'):
                  raise SystemExit(f'Unexpected submodule URL: {url}')
              subprocess.run(['git', 'config', f'submodule.{name}.url',
                              'https://github.com/nova-video-player/' + url[3:]], check=True)
          PY
          git submodule update --init --recursive --depth=1 --jobs=4
          python3 tv/dolby-vision/prepare.py
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build maven build-essential pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build libdovi and test real Dolby Vision conversions
        run: bash tv/dolby-vision/build-libdovi.sh
      - name: Build universal APK from this branch
        env:
          MAKE_JOBS: '3'
        run: |
          cd Video
          ./gradlew --no-daemon -Puniversal assembleNoamazonDebug
      - name: Collect APK and source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t apks < <(find Video/build/outputs/apk/noamazon/debug -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" artifacts/Nova-TV-Dolby-Vision-debug.apk
          cp tv/dolby-vision/sources.json artifacts/sources.json
          cp native/dovi-compat/source/LICENSE artifacts/libdovi-LICENSE
          git rev-parse HEAD > artifacts/branch-commit.txt
          (cd artifacts && sha256sum Nova-TV-Dolby-Vision-debug.apk > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: nova-tv-dolby-vision-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
