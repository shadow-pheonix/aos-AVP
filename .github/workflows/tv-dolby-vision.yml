name: TV Dolby Vision Release

on:
  push:
    branches: [tv-dolby-vision]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-dolby-vision-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/tv-dolby-vision'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned official NOVA components
        shell: bash
        run: |
          set -euo pipefail
          # Relative fork URLs would resolve to shadow-pheonix. Always use official sources.
          python3 - <<'PY'
          import configparser, subprocess
          c = configparser.ConfigParser()
          c.read('.gitmodules')
          for section in c.sections():
              name = section.split('"')[1]
              url = c[section]['url']
              if not url.startswith('../'):
                  raise SystemExit(f'Unexpected submodule URL: {url}')
              subprocess.run(['git', 'config', f'submodule.{name}.url',
                              'https://github.com/nova-video-player/' + url[3:]], check=True)
          PY
          git submodule update --init --recursive --depth=1 --jobs=4
          python3 tv/dolby-vision/prepare.py
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Configure release signing
        env:
          NOVA_RELEASE_KEYSTORE_BASE64: ${{ secrets.NOVA_RELEASE_KEYSTORE_BASE64 }}
          NOVA_RELEASE_STORE_PASSWORD: ${{ secrets.NOVA_RELEASE_STORE_PASSWORD }}
          NOVA_RELEASE_KEY_ALIAS: ${{ secrets.NOVA_RELEASE_KEY_ALIAS }}
          NOVA_RELEASE_KEY_PASSWORD: ${{ secrets.NOVA_RELEASE_KEY_PASSWORD }}
        run: python3 tv/dolby-vision/sign-release.py
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build maven build-essential pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build libdovi and test real Dolby Vision conversions
        run: bash tv/dolby-vision/build-libdovi.sh
      - name: Build universal release APK from this branch
        env:
          MAKE_JOBS: '3'
        run: |
          cd Video
          ./gradlew --no-daemon -Puniversal assembleNoamazonRelease
      - name: Collect APK and source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t apks < <(find Video/build/outputs/apk/noamazon/release -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" artifacts/Nova-TV-Dolby-Vision-6.4.29-universal.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/Nova-TV-Dolby-Vision-6.4.29-universal.apk
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable artifacts/Nova-TV-Dolby-Vision-6.4.29-universal.apk)" = "false"
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('artifacts/Nova-TV-Dolby-Vision-6.4.29-universal.apk') as apk:
              names = set(apk.namelist())
              for abi in ('armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'):
                  assert f'lib/{abi}/libavos.so' in names, f'Missing native player: {abi}'
          print('Verified universal APK native libraries and release manifest.')
          PY
          cp tv/dolby-vision/sources.json artifacts/sources.json
          cp native/dovi-compat/source/LICENSE artifacts/libdovi-LICENSE
          git rev-parse HEAD > artifacts/branch-commit.txt
          (cd artifacts && sha256sum Nova-TV-Dolby-Vision-6.4.29-universal.apk > SHA256.txt)
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="tv-dolby-vision-6.4.29-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          notes="$RUNNER_TEMP/nova-release-notes.md"
          cp tv/dolby-vision/release-notes.md "$notes"
          printf '\nSource commit: `%s`\n\n' "$GITHUB_SHA" >> "$notes"
          cat artifacts/signing-info.txt >> "$notes"
          gh release create "$tag" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NOVA TV Dolby Vision 6.4.29 — universal release" \
            --notes-file "$notes" --latest=false
